
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Notes</title>
</head>
<body>

    <h1>My Offline Notes</h1>

    <textarea id="note" rows="4" cols="40" placeholder="Type a note..."></textarea>
    <br>

    <button id="saveBtn">Save locally</button>
    <button id="loadBtn">Load saved note</button>

    <p id="status"></p>
      <p id="onlineStatus"></p>

    <script>
        document.getElementById('saveBtn').onclick = () => {
            localStorage.setItem('offlineNote', document.getElementById('note').value);
            document.getElementById('status').textContent = 'Saved to localStorage';
        };

        document.getElementById('loadBtn').onclick = () => {
            document.getElementById('note').value = localStorage.getItem('offlineNote') || '';
            document.getElementById('status').textContent = 'Loaded from localStorage';
        };
       
function updateStatus() {
    document.getElementById('onlineStatus').textContent =
        navigator.onLine
        ? 'Online — data can sync'
        : 'Offline — using local data only';
}

window.addEventListener('online', updateStatus);
window.addEventListener('offline', updateStatus);

updateStatus();
    </script>

</body>
</html>
