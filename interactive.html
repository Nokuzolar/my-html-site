<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive File Picker</title>
</head>
<body>

    <h1>Interactive File Picker</h1>

    
    <input type="file" id="fileInput">

    
    <pre id="fileInfo">No file selected</pre>

    
    <div id="dropZone" style="border:2px dashed #64748b;padding:40px;text-align:center;">
        Drag an image here
    </div>

    
    <img id="preview" alt="Preview" style="max-width:200px;margin-top:12px;">

<h2>HTML5 Video Player</h2>

<video controls width="320">
    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
</video>

<h2>HTML5 Audio Player</h2>

<audio controls>
    <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
    Your browser does not support HTML5 audio.
</audio>


<h2>HTML5 Geolocation</h2>

<button id="locBtn">Get my location</button>


<p id="location">Location not requested yet</p>

<h2>Browser Context Detection</h2>
<p id="context"></p>


<script>
    document.getElementById('locBtn').addEventListener('click', () => {
          navigator.geolocation.getCurrentPosition(

            (pos) => {
                document.getElementById('location').textContent =
                    `Lat: ${pos.coords.latitude}, Lng: ${pos.coords.longitude}`;
            },

            () => {
                document.getElementById('location').textContent =
                    'Permission denied or location unavailable';
            }
        );

    });

        document.getElementById('fileInput').addEventListener('change', (e) => {

            const file = e.target.files[0];

            document.getElementById('fileInfo').textContent =
                file ? `Name: ${file.name}, Size: ${file.size} bytes` : 'No file selected';

        });       
        const dropZone = document.getElementById('dropZone');
        const preview = document.getElementById('preview');
 
        dropZone.addEventListener('dragover', (e) => e.preventDefault());

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();

            const file = e.dataTransfer.files[0];

            if (!file || !file.type.startsWith('image/')) return;

            const reader = new FileReader();

            reader.onload = () => {
                preview.src = reader.result;
            };

            reader.readAsDataURL(file);
        });

const ctx = {
    online: navigator.onLine,
    language: navigator.language,
    mobile: /Mobi|Android/i.test(navigator.userAgent)
};

document.getElementById('context').textContent =
    JSON.stringify(ctx, null, 2);

console.log('PM-04 debug context:', ctx);

    </script>

</body>
</html>
